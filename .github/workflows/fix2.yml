name: Fix timer permission duplicate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old permission function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text(encoding='utf-8')
          old = '''function hasTimerPermission(interaction) {
              // Celowo NIE uwzględniamy Administratora ani innych rang.
              return hasTimerRole(interaction.member);
          }

          '''
          if old not in s:
              raise SystemExit('Old duplicate permission function not found')
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "Napraw uprawnienia timera"
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix2.yml
          git commit -m "Usuń tymczasowy workflow 2"
          git push
