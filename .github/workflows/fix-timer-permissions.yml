name: Fix timer permissions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply timer permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.js')
          s = p.read_text(encoding='utf-8')

          old = 'const TIMER_ROLE_NAME = "Generał Inspektor SW ⚖️👑";'
          new = '''const TIMER_FULL_ROLE_NAMES = [
              "Generał Inspektor SW ⚖️👑",
              "Generał SW ⚖️⭐"
          ];
          const TIMER_EMPLOYEE_ROLE_NAME = "Pracownik SW";'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''function hasTimerRole(member) {
              if (!member?.roles) return false;
              return member.roles.cache.some(role => role.name === TIMER_ROLE_NAME);
          }'''
          new = '''function hasTimerFullRole(member) {
              if (!member?.roles) return false;
              return TIMER_FULL_ROLE_NAMES.some(name => member.roles.cache.some(role => role.name === name));
          }

          function hasTimerEmployeeRole(member) {
              if (!member?.roles) return false;
              return member.roles.cache.some(role => role.name === TIMER_EMPLOYEE_ROLE_NAME);
          }

          function hasTimerPermission(interaction, action) {
              if (hasTimerFullRole(interaction.member)) return true;
              return ["pause", "resume"].includes(action) && hasTimerEmployeeRole(interaction.member);
          }

          function timerPermissionMessage(action) {
              if (["pause", "resume"].includes(action)) {
                  return "❌ Pauzę i kontynuowanie kary może wykonywać **Pracownik SW** oraz **Generał Inspektor SW ⚖️👑** i **Generał SW ⚖️⭐**.";
              }
              return "❌ Dodawanie i odejmowanie czasu może wykonywać wyłącznie **Generał Inspektor SW ⚖️👑** oraz **Generał SW ⚖️⭐**.";
          }'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''    if (interaction.isButton() && interaction.customId.startsWith("kara_")) {
          if (!hasTimerPermission(interaction)) {
              return interaction.reply({ content: `❌ Tę funkcję może obsługiwać wyłącznie rola **${TIMER_ROLE_NAME}**.`, ephemeral: true });
          }
          const [, action, id] = interaction.customId.split("_");'''
          new = '''    if (interaction.isButton() && interaction.customId.startsWith("kara_")) {
          const [, action, id] = interaction.customId.split("_");
          if (!hasTimerPermission(interaction, action)) {
              return interaction.reply({ content: timerPermissionMessage(action), ephemeral: true });
          }'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''    if (interaction.isModalSubmit() && interaction.customId.startsWith("kara_modal_")) {
          if (!hasTimerPermission(interaction)) return interaction.reply({ content: `❌ Tę funkcję może obsługiwać wyłącznie rola **${TIMER_ROLE_NAME}**.`, ephemeral: true });
          const [, , action, id] = interaction.customId.split("_");'''
          new = '''    if (interaction.isModalSubmit() && interaction.customId.startsWith("kara_modal_")) {
          const [, , action, id] = interaction.customId.split("_");
          if (!hasTimerPermission(interaction, action)) return interaction.reply({ content: timerPermissionMessage(action), ephemeral: true });'''
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git diff --cached --quiet && exit 0
          git commit -m "Popraw uprawnienia sterowania karą"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-timer-permissions.yml
          git commit -m "Usuń tymczasowy workflow"
          git push
